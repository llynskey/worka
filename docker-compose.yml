services:
  web:
    build:
      context: .
      dockerfile: Worka.WebApp/client/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: /api
        EXPO_PUBLIC_MAPBOX_TOKEN: ${EXPO_PUBLIC_MAPBOX_TOKEN:-}
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: .
      dockerfile: Worka.WebApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JwtSecret: ${JwtSecret:?Set JwtSecret in .env.production}
      # Built here from the plain POSTGRES_* vars so .env.production never has to
      # hold a semicolon-laden connection string (unquoted ';' in a .env value
      # gets truncated by Compose). Guaranteed to match the postgres service creds.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env.production};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env.production};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
      Stripe__SecretKey: ${Stripe__SecretKey:-}
      Stripe__WebhookSecret: ${Stripe__WebhookSecret:-}
      Stripe__ConnectClientId: ${Stripe__ConnectClientId:-}
      Stripe__Currency: ${Stripe__Currency:-gbp}
      Stripe__DefaultCountry: ${Stripe__DefaultCountry:-GB}
      Worka__ServiceFeePercent: ${Worka__ServiceFeePercent:-10}
      Worka__ServiceFeeMinimum: ${Worka__ServiceFeeMinimum:-2}
      Worka__PublicUrl: ${Worka__PublicUrl:-https://worku.site}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__From: ${Smtp__From:-no-reply@worku.site}
      Smtp__UseSsl: ${Smtp__UseSsl:-true}
      # Explicit CORS allowlist in production (the API falls back to
      # allow-any-origin when unset, which is only meant for local dev).
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-https://worku.site}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    volumes:
      - worka_uploads:/app/wwwroot/uploads

  # Nightly logical backups. Dumps land in ./backups on the host (gzip, one
  # per day, 14 kept) so they survive volume wipes — copy them off the server
  # on a schedule (cron + rsync/scp) for real disaster recovery.
  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    entrypoint: >
      sh -c 'while true; do
        pg_dump | gzip > "/backups/worku-$$(date +%F).sql.gz" &&
        echo "backup written: worku-$$(date +%F).sql.gz";
        find /backups -name "worku-*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    volumes:
      - ./backups:/backups
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  worka_uploads:
  caddy_data:
  caddy_config:
